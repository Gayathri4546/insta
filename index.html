<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Link Example</title>
</head>
<body style="text-align: center; font-family: Arial, sans-serif; margin-top: 100px;">

  <h1>Welcome to My Page</h1>
  <p>Click the link below to visit another website:</p>

  <!-- Link to another website -->
  <a href="https://www.google.com" target="_blank" style="font-size: 20px; color: blue; text-decoration: none;">
    Go to Google
  </a>

</body>
</html>
